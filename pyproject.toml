[project]
name = "astro-llm-eval"
version = "0.1.0"
description = "Benchmarking LLM agents on astronomy data-access tasks (TAP, astroquery, pyvo)."
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.288",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*", "tasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real MAST TAP service (deselect with -m 'not live')"]
